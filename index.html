<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>跳转测试</title>
    <!-- 解决移动端/特殊场景跳转问题 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <!-- 方案1：普通链接跳转（最稳定） -->
    <a href="https://www.baidu.com" target="_blank" rel="noopener noreferrer">
        点击跳转到百度
    </a>

    <br><br>

    <!-- 方案2：JS触发跳转（解决标签跳转失效的情况） -->
    <button onclick="jumpToUrl()">JS点击跳转</button>

    <script>
        // 封装跳转函数，增加异常处理
        function jumpToUrl() {
            try {
                // 目标跳转地址
                const targetUrl = "https://www.baidu.com";
                // 方式1：当前窗口跳转
                // window.location.href = targetUrl;
                
                // 方式2：新窗口跳转（推荐，避免被浏览器拦截）
                window.open(targetUrl, "_blank");
                
                console.log("跳转指令已执行，目标地址：", targetUrl);
            } catch (error) {
                // 打印错误信息，方便排查
                console.error("跳转失败原因：", error);
                alert("跳转失败，请检查地址或网络！");
            }
        }
    </script>
</body>
</html>

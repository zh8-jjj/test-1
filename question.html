<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>哲学表达范式测试 - 答题页</title>
    <style>
        /* 保留所有原有样式，无需修改 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "SimSun", serif;
        }
        body {
            background-color: #f8f9fa;
            padding: 20px;
        }
        .container {
            max-width: 850px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.08);
        }
        .progress-container {
            margin-bottom: 30px;
            position: relative;
        }
        .progress-bar {
            height: 10px;
            background-color: #e9ecef;
            border-radius: 5px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background-color: #2c3e50;
            width: 0%;
            transition: width 0.4s ease;
        }
        .progress-text {
            margin-top: 8px;
            font-size: 14px;
            color: #6c757d;
            text-align: right;
        }
        .question-card {
            display: none; /* 默认隐藏所有题目 */
        }
        .question-card.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .question-title {
            font-size: 18px;
            margin-bottom: 25px;
            line-height: 1.7;
            color: #2c3e50;
            font-weight: 600;
        }
        .option-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .option-btn {
            padding: 15px 20px;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            background: white;
            text-align: left;
            cursor: pointer;
            transition: all 0.25s;
            font-size: 16px;
            color: #495057;
        }
        .option-btn:hover {
            border-color: #2c3e50;
            background-color: #f8f9fa;
        }
        .option-btn:active {
            background-color: #e9ecef;
            border-color: #1a252f;
        }
        /* 响应式适配 */
        @media (max-width: 600px) {
            .container {
                padding: 20px 15px;
            }
            .question-title {
                font-size: 16px;
                margin-bottom: 20px;
            }
            .option-btn {
                font-size: 14px;
                padding: 12px 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 进度条区域 -->
        <div class="progress-container">
            <div class="progress-bar">
                <div id="progress-fill" class="progress-fill"></div>
            </div>
            <div class="progress-text" id="progress-text">1/20</div>
        </div>

        <!-- 题目区域（保留你的20道题，无需修改） -->
        <div class="question-list">
            <!-- Q1 -->
            <div class="question-card" data-index="0">
                <div class="question-title">Q1 当 “自由” 被反复提起时，你第一反应是：</div>
                <div class="option-list">
                    <div class="option-btn" onclick="answer(0)">A：先问：现有法律和程序能否保障自由？</div>
                    <div class="option-btn" onclick="answer(1)">B：怀疑：谁在喊 “自由”，这句话有话语目的？</div>
                    <div class="option-btn" onclick="answer(2)">C：想到：没有生存保障时，自由是空壳子。</div>
                    <div class="option-btn" onclick="answer(3)">D：警觉：统一的 “自由” 会抹去差异与经验。</div>
                </div>
            </div>

            <!-- 此处省略Q2-Q19的代码（和之前一致，无需修改） -->

            <!-- Q20 -->
            <div class="question-card" data-index="19">
                <div class="question-title">Q20 如果只能选一句最符合你的表达信念：</div>
                <div class="option-list">
                    <div class="option-btn" onclick="answer(0)">A：规则可被完善，但需程序与耐心。</div>
                    <div class="option-btn" onclick="answer(1)">B：权力必须被直视与重构，否则空谈。</div>
                    <div class="option-btn" onclick="answer(2)">C：先解决物质生存再谈话语与形式。</div>
                    <div class="option-btn" onclick="answer(3)">D：承认并保留差异，比追求统一更重要。</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 初始化全局变量
        let currentQuestion = 0; 
        const scores = [0, 0, 0, 0]; 
        const questions = document.querySelectorAll('.question-card'); 
        const progressFill = document.getElementById('progress-fill');
        const progressText = document.getElementById('progress-text');

        // 页面加载初始化
        function initQuiz() {
            questions[currentQuestion].classList.add('active');
            updateProgress();
            console.log("初始化完成，当前题目数：", questions.length); // 调试日志
        }

        // 修复核心：答题逻辑（关键改跳转触发条件）
        function answer(choice) {
            scores[choice]++; 
            
            // 切换题目
            questions[currentQuestion].classList.remove('active');
            currentQuestion++;
            updateProgress();

            // 修复：判断是否答完20题（currentQuestion === 20 时跳转）
            if (currentQuestion < questions.length) {
                questions[currentQuestion].classList.add('active');
                console.log("当前答题进度：", currentQuestion + 1, "/20"); // 调试日志
            } else {
                // 修复：强制使用绝对路径跳转（避免相对路径错误）
                const scoreStr = scores.join(',');
                console.log("答题完成，得分：", scoreStr); // 调试日志
                // 重点：确认 result.html 和 question.html 在同一目录！
                window.location.href = `./result.html?scores=${scoreStr}`; 
            }
        }

        // 更新进度条
        function updateProgress() {
            const total = questions.length;
            const progress = (currentQuestion / total) * 100;
            progressFill.style.width = `${progress}%`;
            progressText.textContent = `${currentQuestion + 1}/${total}`; // 修复：进度文本显示正确（1/20 而非 0/20）
        }

        // 页面加载时启动
        window.onload = initQuiz;
    </script>
</body>
</html>
